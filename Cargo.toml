[package]
name = "quire-walk"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "The shared no_std walker toolkit -- an explicit heap stack of typed frames with enter and exit callbacks, and an arena that stores each node after its children."
authors = ["Agent IX <peter@agent-ix.ai>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-walk"
publish = false

[lib]
name = "quire_walk"
path = "src/lib.rs"

# A shared leaf: no dependency beyond `core` and `alloc`, and no features, so
# feature unification cannot bring `std` or any other crate into it.
[dependencies]

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# `cargo kani` sets `--cfg kani` for the proof harnesses in `src/proofs.rs`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
all = "deny"
